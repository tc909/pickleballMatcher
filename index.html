<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MatchFlow - v12.7.8</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .app { max-width: 28rem; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .sticky { position: sticky; top: 0; z-index: 50; background: #0f172a; }
    .header { padding: 1.25rem 1.25rem 1rem; border-bottom: 4px solid #f97316; }
    .brand { color: #fff; text-align: center; font-size: 1.55rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin-bottom: 1rem; }
    .brand span { color: #f97316; }

    .court-bar {
      display: flex; gap: 0.4rem; padding: 0.55rem 0.75rem;
      background: #111827; border-bottom: 1px solid #334155; overflow-x: auto;
    }
    .court-pill {
      border: none; background: #1e293b; color: #cbd5e1; border-radius: 999px;
      padding: 0.8rem 1rem; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase; white-space: nowrap; cursor: pointer;
    }
    .court-pill.active { background: #f97316; color: #fff; }
    .court-pill.add {
      background: #0f172a; border: 2px dashed #475569; color: #fff; min-width: 44px;
    }

    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .tab-btn {
      flex: 1; border: none; background: transparent; padding: 1rem; cursor: pointer;
      font-size: 0.76rem; font-weight: 900; color: #94a3b8; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tab-btn.active { color: #f97316; border-bottom: 4px solid #f97316; }

    main { flex: 1; padding: 1rem 1.25rem 1.5rem; }

    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 1.35rem;
      padding: 1rem; margin-bottom: 0.9rem;
    }
    .card.live {
      border: 2px solid #f97316;
      box-shadow: 0 10px 25px rgba(249,115,22,0.14);
    }
    .card.done { background: #0f172a; color: #fff; border-color: #1e293b; }
    .card.upcoming { background: #fff7ed; border: 1px solid #fed7aa; }

    .muted { color: #64748b; }
    .tiny {
      font-size: 0.7rem; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .title { font-size: 1rem; font-weight: 900; }
    .badge {
      display: inline-block; padding: 0.25rem 0.55rem; border-radius: 999px;
      background: #fff7ed; color: #ea580c; font-size: 0.66rem; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .vs { color: #f97316; font-size: 1.2rem; font-style: italic; font-weight: 900; }

    .btn {
      border: none; border-radius: 1rem; padding: 1rem; cursor: pointer;
      font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .btn.orange { background: #f97316; color: #fff; width: 100%; }
    .btn.dark { background: #0f172a; color: #fff; }
    .btn.green { background: #10b981; color: #fff; width: 100%; }
    .btn.red { background: #dc2626; color: #fff; width: 100%; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .input-block { background: #e2e8f0; padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; }
    .input, .select {
      width: 100%; border: none; outline: none; background: #fff; color: #0f172a;
      border-radius: 0.8rem; padding: 1rem; font-weight: 900; text-transform: uppercase;
    }
    .input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    .autocomplete { position: relative; }
    .autocomplete-list {
      position: absolute; top: calc(100% - 0.15rem); left: 0; right: 0; z-index: 100;
      background: #fff; border: 2px solid #e2e8f0; border-top: none; border-radius: 0 0 0.8rem 0.8rem;
      max-height: 220px; overflow-y: auto; display: none;
      box-shadow: 0 10px 15px rgba(0,0,0,0.08);
    }
    .autocomplete-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1rem; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      font-weight: 700; font-size: 0.85rem;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #f8fafc; }
    .danger-x {
      color: #ef4444; font-size: 1.35rem; font-weight: 900; line-height: 1;
      padding: 0 0.35rem; border-radius: 999px;
    }
    .danger-x:hover { background: #fee2e2; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .row.wrap { flex-wrap: wrap; }

    .player-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 1rem; border-bottom: 1px solid #f1f5f9;
    }
    .player-row:last-child { border-bottom: none; }

    .player-left {
      display: flex; align-items: flex-start; gap: 0.85rem; min-width: 0;
    }
    .player-number {
      min-width: 2rem;
      font-size: 1.1rem;
      font-weight: 900;
      color: #64748b;
      line-height: 1.2;
      padding-top: 0.05rem;
    }

    .small-btn {
      border: none; background: none; cursor: pointer; font-size: 0.68rem;
      font-weight: 900; text-transform: uppercase;
    }
    .small-btn.dark { color: #0f172a; }
    .small-btn.red { color: #f87171; }

    .small-select {
      border: none; background: #f1f5f9; color: #0f172a; border-radius: 0.75rem;
      padding: 0.55rem 0.7rem; font-weight: 900;
    }

    .score-box {
      width: 4.5rem; height: 4.5rem; border: 2px solid transparent; outline: none;
      background: #f1f5f9; border-radius: 1rem; text-align: center;
      font-size: 1.45rem; font-weight: 900;
    }
    .score-box:focus { border-color: #f97316; }

    .toggle-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .toggle-btn {
      flex: 1; border: none; border-radius: 1rem; padding: 0.9rem 1rem; cursor: pointer;
      background: #e2e8f0; color: #475569; font-weight: 900; font-size: 0.72rem;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .toggle-btn.active { background: #0f172a; color: #fff; }

    .hidden { display: none !important; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <datalist id="events-list"></datalist>

  <div class="app">
    <div class="sticky">
      <div class="header">
        <div class="brand">Match<span>Flow</span></div>
        <div id="current-match-ui"></div>
      </div>

      <div id="court-bar" class="court-bar"></div>

      <div class="tab-bar">
        <button id="tab-players" class="tab-btn active" onclick="switchTab('players')">Players</button>
        <button id="tab-schedule" class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
        <button id="tab-leaderboard" class="tab-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
      </div>
    </div>

    <main>
      <section id="view-players">
        <div id="player-list-card" class="card" style="padding:0; overflow:hidden;"></div>

        <div class="input-block">
          <div id="active-court-add-label" class="tiny muted" style="margin-bottom:0.5rem;"></div>

          <div class="autocomplete">
            <input
              id="add-name"
              class="input"
              type="text"
              placeholder="PLAYER NAME"
              autocomplete="off"
              onfocus="showPlayerSuggestions('add-name','add-dupr','add-dropdown')"
              oninput="showPlayerSuggestions('add-name','add-dupr','add-dropdown')"
            />
            <div id="add-dropdown" class="autocomplete-list"></div>
          </div>

          <div class="input-row">
            <input id="add-dupr" class="input" type="text" placeholder="DUPR ID (OPTIONAL)" />
            <button class="btn dark" style="padding:0 1.2rem;" onclick="addPlayer()">Add</button>
          </div>
        </div>

        <button class="btn red" style="width:100%;" onclick="clearData()">Clear Data</button>
      </section>

      <section id="view-schedule" class="hidden">
        <div id="schedule-list"></div>
      </section>

      <section id="view-leaderboard" class="hidden">
        <div id="leaderboard-meta"></div>
        <div id="leaderboard-list"></div>
      </section>
    </main>
  </div>

  <script>
    const MAX_COURTS = 6;
    const DEFAULT_RATING = 3.5;
    const UPCOMING_PREVIEW_COUNT = 8;

    // Synchronized with MatchList_v2.txt
    const FIXED_MATCH_MATRIX = {
      5: [
        { teamA: [0,1], teamB: [2,3] }, 
        { teamA: [0,2], teamB: [1,4] }, 
        { teamA: [0,3], teamB: [2,4] }, 
        { teamA: [0,4], teamB: [1,3] }, 
        { teamA: [1,2], teamB: [3,4] }, 
        { teamA: [0,1], teamB: [2,3] }, 
        { teamA: [0,2], teamB: [1,4] }, 
        { teamA: [0,3], teamB: [2,4] }, 
        { teamA: [0,4], teamB: [1,3] }, 
        { teamA: [1,2], teamB: [3,4] }, 
        { teamA: [0,1], teamB: [2,3] }, 
        { teamA: [0,2], teamB: [1,4] }, 
        { teamA: [0,3], teamB: [2,4] }, 
        { teamA: [0,4], teamB: [1,3] }  
      ],
      6: [
        { teamA: [0, 1], teamB: [2, 3] }, // R1
        { teamA: [0, 4], teamB: [1, 5] }, // R2
        { teamA: [2, 4], teamB: [3, 5] }, // R3
        { teamA: [0, 2], teamB: [1, 3] }, // R4
        { teamA: [0, 5], teamB: [1, 4] }, // R5
        { teamA: [2, 5], teamB: [3, 4] }, // R6
        { teamA: [0, 3], teamB: [1, 2] }, // R7
        { teamA: [0, 1], teamB: [4, 5] }, // R8
        { teamA: [2, 4], teamB: [3, 5] }, // R9
        { teamA: [0, 3], teamB: [1, 2] }, // R10
        { teamA: [0, 1], teamB: [4, 5] }, // R11
        { teamA: [2, 5], teamB: [3, 4] }, // R12
        { teamA: [0, 2], teamB: [1, 3] }, // R13
        { teamA: [0, 4], teamB: [1, 5] }  // R14
      ],
      7: [
        { teamA: [3, 5], teamB: [4, 6] }, // R1
        { teamA: [0, 1], teamB: [2, 6] }, // R2
        { teamA: [2, 3], teamB: [4, 5] }, // R3
        { teamA: [0, 5], teamB: [1, 6] }, // R4
        { teamA: [1, 3], teamB: [2, 4] }, // R5
        { teamA: [0, 4], teamB: [5, 6] }, // R6
        { teamA: [0, 3], teamB: [1, 2] }, // R7
        { teamA: [3, 6], teamB: [4, 5] }, // R8
        { teamA: [0, 2], teamB: [1, 6] }, // R9
        { teamA: [2, 5], teamB: [3, 4] }, // R10
        { teamA: [0, 6], teamB: [1, 5] }, // R11
        { teamA: [1, 4], teamB: [2, 3] }, // R12
        { teamA: [0, 4], teamB: [5, 6] }, // R13
        { teamA: [0, 1], teamB: [2, 3] }  // R14
      ],
      8: [
        { teamA: [0,1], teamB: [2,3] }, 
        { teamA: [4,5], teamB: [6,7] }, 
        { teamA: [0,2], teamB: [1,3] }, 
        { teamA: [4,6], teamB: [5,7] }, 
        { teamA: [0,3], teamB: [1,2] }, 
        { teamA: [4,7], teamB: [5,6] }, 
        { teamA: [0,4], teamB: [1,5] }, 
        { teamA: [2,6], teamB: [3,7] }, 
        { teamA: [0,5], teamB: [1,4] }, 
        { teamA: [2,7], teamB: [3,6] }, 
        { teamA: [0,6], teamB: [1,7] }, 
        { teamA: [2,4], teamB: [3,5] }, 
        { teamA: [0,7], teamB: [1,6] }, 
        { teamA: [2,5], teamB: [3,4] }
      ]
    };

    const STORAGE_KEYS = {
      state: 'pickleMatchV12_7_8_state',
      memoryPlayers: 'pickleMatchV12_7_8_memoryPlayers'
    };

    let state = loadState();

    function createCourt(index = 1) {
      const id = Date.now() + Math.random();
      return {
        id,
        name: `Court ${index}`,
        eventName: `Event ${index}`,
        eventDate: getLocalYYYYMMDD(),
        scoreType: 'RALLY',
        players: [],
        completedMatches: [],
        currentMatch: null,
        roundCounter: 1,
        pairingHistory: {},
        matchupHistory: {},
        recentAppearances: {},
        matchHistory: [],
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.state);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed?.courts?.length) return parsed;
        }
      } catch (e) {}
      const firstCourt = createCourt(1);
      return {
        activeTab: 'players',
        activeCourtId: firstCourt.id,
        leaderboardMode: 'court',
        courts: [firstCourt]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEYS.state, JSON.stringify(state));
    }

    function loadMemoryPlayers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.memoryPlayers) || '[]');
      } catch (e) { return []; }
    }

    function saveMemoryPlayers(players) {
      localStorage.setItem(STORAGE_KEYS.memoryPlayers, JSON.stringify(players));
    }

    function toTitleCase(str) {
      return String(str || '').trim().toLowerCase().replace(/\s+/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function upsertMemoryPlayer(name, duprId = '') {
      const trimmed = toTitleCase(name);
      if (!trimmed) return;
      const list = loadMemoryPlayers();
      const existing = list.find(p => p.name.toLowerCase() === trimmed.toLowerCase());
      if (existing) {
        existing.name = trimmed;
        if (duprId !== undefined) existing.duprId = (duprId || '').trim();
      } else {
        list.push({ name: trimmed, duprId: (duprId || '').trim() });
      }
      list.sort((a, b) => a.name.localeCompare(b.name));
      saveMemoryPlayers(list);
      updateEventsList();
    }

    function deleteMemoryPlayer(name) {
      const filtered = loadMemoryPlayers().filter(p => p.name.toLowerCase() !== name.toLowerCase());
      saveMemoryPlayers(filtered);
      updateEventsList();
    }

    function updateEventsList() {
      const dl = document.getElementById('events-list');
      if (!dl) return;
      const events = [...new Set(state.courts.map(c => c.eventName).filter(Boolean))];
      dl.innerHTML = events.map(ev => `<option value="${escapeHtml(ev)}"></option>`).join('');
    }

    function getCourtById(id) { return state.courts.find(c => c.id === id); }
    function getSelectedCourt() { return getCourtById(state.activeCourtId) || state.courts[0]; }
    function getPlayerById(court, playerId) { return court.players.find(p => p.id === playerId); }
    function getActivePlayers(court) { return court.players.filter(p => p.isActive !== false); }
    function getCompletedMatches(court) { return court.completedMatches || []; }
    function getLocalYYYYMMDD() { return new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

    function switchTab(tab) { state.activeTab = tab; saveState(); renderApp(); }
    function switchCourt(courtId) { state.activeCourtId = courtId; saveState(); renderApp(); }

    function addCourt() {
      if (state.courts.length >= MAX_COURTS) return alert(`Max ${MAX_COURTS} courts.`);
      const newCourt = createCourt(state.courts.length + 1);
      state.courts.push(newCourt);
      state.activeCourtId = newCourt.id;
      saveState();
      renderApp();
    }

    function clearData() {
      if (!confirm('Clear event data?')) return;
      const firstCourt = createCourt(1);
      state = { activeTab: 'players', activeCourtId: firstCourt.id, leaderboardMode: 'court', courts: [firstCourt] };
      saveState();
      renderApp();
    }

    function editCourtEventName() {
      const court = getSelectedCourt();
      const next = prompt('Edit Event Name', court.eventName || court.name);
      if (next !== null) { court.eventName = next.trim() || court.name; saveState(); renderApp(); }
    }

    function updateCourtScoreType(val) { getSelectedCourt().scoreType = val; saveState(); renderApp(); }
    function toggleLeaderboardMode(mode) { state.leaderboardMode = mode; saveState(); renderApp(); }

    function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function showPlayerSuggestions(inputId, duprId, dropdownId) {
      const query = document.getElementById(inputId).value.trim().toLowerCase();
      const dropdown = document.getElementById(dropdownId);
      const activeNames = new Set(state.courts.flatMap(c => c.players.map(p => p.name.toLowerCase())));
      const list = loadMemoryPlayers().filter(p => !activeNames.has(p.name.toLowerCase()) && (!query || p.name.toLowerCase().includes(query)));

      if (!list.length) { dropdown.style.display = 'none'; return; }
      dropdown.innerHTML = list.map(p => `<div class="autocomplete-item"><div onclick="selectMemoryPlayerAndAdd('${escapeHtml(p.name)}','${escapeHtml(p.duprId)}','${inputId}','${duprId}','${dropdownId}')">${escapeHtml(p.name)} ${p.duprId ? `<span class="muted">· ${p.duprId}</span>` : ''}</div><div class="danger-x" onclick="event.stopPropagation(); deleteMemoryPlayer('${p.name}'); showPlayerSuggestions('${inputId}','${duprId}','${dropdownId}')">×</div></div>`).join('');
      dropdown.style.display = 'block';
    }

    function selectMemoryPlayerAndAdd(name, dupr, inputId, duprId, dropdownId) {
      document.getElementById(inputId).value = name;
      document.getElementById(duprId).value = dupr || '';
      document.getElementById(dropdownId).style.display = 'none';
      addPlayer();
    }

    function addPlayer() {
      const court = getSelectedCourt();
      const nIn = document.getElementById('add-name');
      const dIn = document.getElementById('add-dupr');
      const name = toTitleCase(nIn.value);
      if (!name) return;
      if (court.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert('Duplicate player.');
      
      court.players.push({ id: Date.now() + Math.random(), name, duprId: dIn.value.trim(), rating: DEFAULT_RATING, wins: 0, losses: 0, isActive: true });
      upsertMemoryPlayer(name, dIn.value.trim());
      nIn.value = ''; dIn.value = '';
      ensureMatchExists(court);
      saveState(); renderApp();
    }

    function editPlayer(id) {
      const court = getSelectedCourt();
      const p = getPlayerById(court, id);
      const n = prompt('Name', p.name); if (!n) return;
      const d = prompt('DUPR', p.duprId);
      p.name = toTitleCase(n); p.duprId = (d || '').trim();
      upsertMemoryPlayer(p.name, p.duprId);
      saveState(); renderApp();
    }

    function movePlayerToCourt(id, targetId) {
      const from = getSelectedCourt();
      const to = getCourtById(Number(targetId));
      const idx = from.players.findIndex(p => p.id === id);
      const p = from.players[idx];
      if (to.players.some(tp => tp.name.toLowerCase() === p.name.toLowerCase())) return alert('Duplicate on target.');
      from.players.splice(idx, 1);
      p.isActive = true;
      to.players.push(p);
      rebuildCourtScheduling(from);
      ensureMatchExists(to);
      saveState(); renderApp();
    }

    function handleDrop(id) { getPlayerById(getSelectedCourt(), id).isActive = false; rebuildCourtScheduling(getSelectedCourt()); saveState(); renderApp(); }
    function handleActivate(id) { getPlayerById(getSelectedCourt(), id).isActive = true; ensureMatchExists(getSelectedCourt()); saveState(); renderApp(); }
    function removePlayerPermanently(id) {
      const court = getSelectedCourt();
      court.players = court.players.filter(p => p.id !== id);
      rebuildCourtScheduling(court);
      saveState(); renderApp();
    }

    function ensureMatchExists(court) {
      if (!court.currentMatch && getActivePlayers(court).length >= 4) court.currentMatch = getNextMatch(court);
    }

    function rebuildCourtScheduling(court) {
      court.completedMatches = (court.completedMatches || []).filter(m => [...m.teamAIds, ...m.teamBIds].every(id => getPlayerById(court, id)?.isActive));
      if (court.currentMatch && ![...court.currentMatch.teamAIds, ...court.currentMatch.teamBIds].every(id => getPlayerById(court, id)?.isActive)) court.currentMatch = null;
      court.pairingHistory = {}; court.matchupHistory = {}; court.recentAppearances = {}; court.matchHistory = []; court.roundCounter = 1;
      court.completedMatches.forEach(m => { applySchedulingHistory(court, m); court.roundCounter = Math.max(court.roundCounter, m.round + 1); });
      if (court.currentMatch) { applySchedulingHistory(court, court.currentMatch); court.roundCounter = Math.max(court.roundCounter, court.currentMatch.round + 1); }
      else ensureMatchExists(court);
    }

    function pairKey(a, b) { return [a, b].sort((x, y) => x - y).join('_'); }
    function matchupKey(tA, tB) { return [[...tA].sort().join('-'), [...tB].sort().join('-')].sort().join('__'); }

    function applySchedulingHistory(court, m) {
      const ids = [...m.teamAIds, ...m.teamBIds];
      court.matchHistory.push({ round: m.round, players: ids });
      ids.forEach(id => court.recentAppearances[id] = (court.recentAppearances[id] || 0) + 1);
      const inc = (map, k) => map[k] = (map[k] || 0) + 1;
      inc(court.pairingHistory, pairKey(m.teamAIds[0], m.teamAIds[1]));
      inc(court.pairingHistory, pairKey(m.teamBIds[0], m.teamBIds[1]));
      inc(court.matchupHistory, matchupKey(m.teamAIds, m.teamBIds));
    }

    function getFixedMatrixMatch(court) {
      const active = getActivePlayers(court);
      const matrix = FIXED_MATCH_MATRIX[active.length];
      if (!matrix || court.roundCounter > matrix.length) return null;
      const s = matrix[court.roundCounter - 1];
      return { round: court.roundCounter++, teamAIds: [active[s.teamA[0]].id, active[s.teamA[1]].id], teamBIds: [active[s.teamB[0]].id, active[s.teamB[1]].id], scoreA: null, scoreB: null };
    }

    function getGeneratedMatch(court) {
      const ids = getActivePlayers(court).map(p => p.id);
      if (ids.length < 4) return null;
      let best = null;
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          for (let k = 0; k < ids.length; k++) {
            if (k === i || k === j) continue;
            for (let l = k + 1; l < ids.length; l++) {
              if (l === i || l === j) continue;
              const tA = [ids[i], ids[j]], tB = [ids[k], ids[l]];
              const score = (ids.reduce((s, id) => s + (court.matchHistory[court.matchHistory.length-1]?.players.includes(id) ? 20 : 0), 0)) + 
                            (court.pairingHistory[pairKey(tA[0], tA[1])] || 0) * 200 + (court.matchupHistory[matchupKey(tA, tB)] || 0) * 60;
              if (!best || score < best.score) best = { score, round: court.roundCounter, teamAIds: tA, teamBIds: tB, scoreA: null, scoreB: null };
            }
          }
        }
      }
      if (best) court.roundCounter++;
      return best;
    }

    function getNextMatch(court) { return getFixedMatrixMatch(court) || getGeneratedMatch(court); }

    function submitScoreAction(sA, sB) {
      const court = getSelectedCourt();
      const a = parseInt(sA), b = parseInt(sB);
      if (isNaN(a) || isNaN(b) || a === b) return alert('Invalid score.');
      court.currentMatch.scoreA = a; court.currentMatch.scoreB = b;
      updateRatings(court, court.currentMatch);
      court.completedMatches.push({ ...court.currentMatch });
      court.currentMatch = null;
      ensureMatchExists(court);
      saveState(); renderApp();
    }

    function updateRatings(court, m) {
      const pA = m.teamAIds.map(id => getPlayerById(court, id)), pB = m.teamBIds.map(id => getPlayerById(court, id));
      const rA = (pA[0].rating + pA[1].rating) / 2, rB = (pB[0].rating + pB[1].rating) / 2;
      const expA = 1 / (1 + Math.pow(10, (rB - rA) / 0.6));
      const actA = m.scoreA > m.scoreB ? 1 : 0;
      const delta = 0.3 * (1 + Math.abs(m.scoreA - m.scoreB) / 11) * (actA - expA);
      pA.forEach(p => { p.rating = parseFloat((p.rating + delta).toFixed(3)); if (actA) p.wins++; else p.losses++; });
      pB.forEach(p => { p.rating = parseFloat((p.rating - delta).toFixed(3)); if (!actA) p.wins++; else p.losses++; });
    }

    function exportDUPRCSV() {
      let csv = '\uFEFF"","","","matchType","scoreType","event","date","playerA1","playerA1DuprId","","playerA2","playerA2DuprId","","playerB1","playerB1DuprId","","playerB2","playerB2DuprId","","","teamAGame1","teamBGame1"\n';
      state.courts.forEach(c => c.completedMatches.forEach(m => {
        const getP = (id) => getPlayerById(c, id) || {};
        const p = [getP(m.teamAIds[0]), getP(m.teamAIds[1]), getP(m.teamBIds[0]), getP(m.teamBIds[1])];
        csv += `,"","","D","${c.scoreType}","${c.eventName}","${c.eventDate}","${p[0].name}","${p[0].duprId}","","${p[1].name}","${p[1].duprId}","","${p[2].name}","${p[2].duprId}","","${p[3].name}","${p[3].duprId}","","","${m.scoreA}","${m.scoreB}"\n`;
      }));
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `DUPR_${getLocalYYYYMMDD()}.csv`; a.click();
    }

    function renderApp() {
      const court = getSelectedCourt();
      renderCourtBar();
      renderCurrentMatchUI(court);
      renderPlayersTabUI(court);
      renderScheduleTabUI(court);
      renderLeaderboardTabUI(court);
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${state.activeTab}`));
      document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hidden', s.id !== `view-${state.activeTab}`));
    }

    function renderCourtBar() {
      document.getElementById('court-bar').innerHTML = state.courts.map(c => `<button class="court-pill ${c.id === state.activeCourtId ? 'active' : ''}" onclick="switchCourt(${c.id})">${escapeHtml(c.name)}</button>`).join('') + (state.courts.length < MAX_COURTS ? '<button class="court-pill add" onclick="addCourt()">+</button>' : '');
    }

    function renderCurrentMatchUI(court) {
      const wrap = document.getElementById('current-match-ui');
      if (!court.currentMatch) { wrap.innerHTML = `<div class="card center" style="background:#111827; color:#fff;"><div class="tiny muted">${escapeHtml(court.name)}</div><div class="title">Waiting for players</div></div>`; return; }
      const m = court.currentMatch; const p = (id) => getPlayerById(court, id)?.name || 'TBD';
      wrap.innerHTML = `<div class="card live"><div class="row"><div class="tiny muted">${escapeHtml(court.name)} · Game ${m.round}</div><span class="badge">Live</span></div><div class="row" style="text-align:center; font-weight:900; margin:1rem 0;"><div style="width:40%">${p(m.teamAIds[0])}<br>${p(m.teamAIds[1])}</div><div class="vs">VS</div><div style="width:40%">${p(m.teamBIds[0])}<br>${p(m.teamBIds[1])}</div></div><div class="row" style="justify-content:center; gap:1rem;"><input id="scA" class="score-box" type="number" placeholder="0"><input id="scB" class="score-box" type="number" placeholder="0"></div><button class="btn orange" style="margin-top:1rem;" onclick="submitScoreAction(document.getElementById('scA').value, document.getElementById('scB').value)">Submit</button></div>`;
    }

    function renderPlayersTabUI(court) {
      document.getElementById('active-court-add-label').textContent = `Add to ${court.name}`;
      document.getElementById('player-list-card').innerHTML = court.players.length ? court.players.map((p, i) => `<div class="player-row"><div class="player-left"><div class="player-number">${i+1}</div><div><div class="title">${escapeHtml(p.name)} ${p.isActive ? '' : '<span class="badge">Dropped</span>'}</div><div class="tiny muted">DUPR: ${p.duprId || 'N/A'}</div></div></div><div class="row">${p.isActive ? `<select class="small-select" onchange="movePlayerToCourt(${p.id}, this.value)">${state.courts.map(c => `<option value="${c.id}" ${c.id === court.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select><button class="small-btn dark" onclick="editPlayer(${p.id})">Edit</button><button class="small-btn red" onclick="handleDrop(${p.id})">Drop</button>` : `<button class="small-btn dark" onclick="handleActivate(${p.id})">Activate</button><button class="small-btn red" onclick="removePlayerPermanently(${p.id})">Del</button>`}</div></div>`).join('') : '<div class="card center muted">No players</div>';
    }

    function renderScheduleTabUI(court) {
      let html = court.completedMatches.map(m => `<div class="card done"><div class="tiny" style="color:#94a3b8;">Game ${m.round} · Done</div><div class="row" style="text-align:center;"><div style="width:40%">${getPlayerById(court,m.teamAIds[0]).name}<br>${getPlayerById(court,m.teamAIds[1]).name}<div style="font-size:1.5rem; color:#f97316;">${m.scoreA}</div></div><div class="vs">VS</div><div style="width:40%">${getPlayerById(court,m.teamBIds[0]).name}<br>${getPlayerById(court,m.teamBIds[1]).name}<div style="font-size:1.5rem; color:#f97316;">${m.scoreB}</div></div></div></div>`).join('');
      document.getElementById('schedule-list').innerHTML = html || '<div class="card center muted">No matches yet</div>';
    }

    function renderLeaderboardTabUI(court) {
      document.getElementById('leaderboard-meta').innerHTML = `<div class="card"><div class="row"><div><div class="tiny muted">Event</div><div class="title">${escapeHtml(court.eventName)}</div></div><button class="btn dark" onclick="editCourtEventName()">Edit</button></div><select class="select" style="margin-top:1rem;" onchange="updateCourtScoreType(this.value)"><option value="RALLY" ${court.scoreType==='RALLY'?'selected':''}>Rally</option><option value="SIDEOUT" ${court.scoreType==='SIDEOUT'?'selected':''}>SideOut</option></select><button class="btn green" style="margin-top:1rem;" onclick="exportDUPRCSV()">Export CSV</button></div>`;
      const pool = state.leaderboardMode === 'all' ? state.courts.flatMap(c => c.players) : court.players;
      document.getElementById('leaderboard-list').innerHTML = [...pool].sort((a,b) => b.rating - a.rating).map((p, i) => `<div class="card"><div class="row"><div style="display:flex; align-items:center;"><div style="font-size:1.2rem; font-weight:900; color:#64748b; width:2rem;">#${i+1}</div><div><div class="title">${escapeHtml(p.name)}</div><div class="tiny muted">W:${p.wins} L:${p.losses}</div></div></div><div style="font-size:1.2rem; font-weight:900; color:#f97316;">${p.rating.toFixed(3)}</div></div></div>`).join('');
    }

    document.addEventListener('click', e => { if (!e.target.closest('.autocomplete')) document.querySelectorAll('.autocomplete-list').forEach(l => l.style.display='none'); });
    updateEventsList(); renderApp();
  </script>
</body>
</html>
